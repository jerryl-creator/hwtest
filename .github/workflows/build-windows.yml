name: Build Windows exe

# Every push and pull request: build Nyanspect and keep the results as downloadable artifacts:
#   nyanspect.exe                    Windows x64 (Intel and AMD), cross-compiled on Linux like build-windows.sh
#   nyanspect-arm64.exe              Windows ARM64 (Snapdragon / Windows on ARM), built natively on Windows 11 ARM
#   nyanspect-linux-x86_64.tar.gz    Linux x86_64 (Intel and AMD)  } built natively on Ubuntu 22.04, so they
#   nyanspect-linux-arm64.tar.gz     Linux ARM64                   } run on that and anything newer
# Pushing a version tag (e.g. v1.4.0): also attach all of them to that GitHub release.
# (The workflow keeps its original file name so the README badge and run history stay put.)
on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't need a new build (tag pushes always build).
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 (cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (rustup) with the Windows target
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable

      - name: Install the MinGW-w64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Cache Cargo downloads and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-gnu-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-gnu-

      - name: Build
        run: ./build-windows.sh

      - uses: actions/upload-artifact@v7
        with:
          name: nyanspect-windows
          path: dist/nyanspect.exe
          if-no-files-found: error

  build-arm64:
    name: Windows ARM64 (native)
    runs-on: windows-11-arm
    defaults:
      run:
        shell: pwsh
    env:
      TARGET: aarch64-pc-windows-msvc
      # Link the C runtime statically, so the exe doesn't need the VC++ redistributable.
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      CARGO_PROFILE_RELEASE_STRIP: 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (rustup)
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            Remove-Item rustup-init.exe
            "$env:USERPROFILE\.cargo\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
            $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          }
          rustup toolchain install stable --profile minimal --target $env:TARGET
          rustup default stable
          rustc --version --verbose

      - name: Cache Cargo downloads and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-arm64-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-arm64-

      - name: Build
        run: |
          cargo build --release --locked --target $env:TARGET
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/$env:TARGET/release/nyanspect.exe" dist/nyanspect-arm64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: nyanspect-windows-arm64
          path: dist/nyanspect-arm64.exe
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          # The oldest supported Ubuntu: a binary built against an older glibc runs on newer distros too.
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (rustup)
        run: |
          # The ARM runner image may not ship with Rust: install rustup if it's missing.
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install ALSA (sound) and udev (gamepads) development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libclang-dev linux-libc-dev pkg-config

      - name: Cache Cargo downloads and build output
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-${{ matrix.arch }}-

      - name: Run tests
        run: |
          cargo test --locked
          cargo test --manifest-path vendor/nokhwa-bindings-windows/Cargo.toml

      - name: Build and package
        run: ./package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: nyanspect-linux-${{ matrix.arch }}
          path: dist/nyanspect-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-arm64, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: nyanspect-*
          path: dist
          merge-multiple: true

      - name: Create the release if needed and upload the downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Nyanspect $TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/nyanspect.exe dist/nyanspect-arm64.exe \
            dist/nyanspect-linux-x86_64.tar.gz dist/nyanspect-linux-arm64.tar.gz --clobber
