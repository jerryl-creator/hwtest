[package]
name = "nyanspect"
version = "1.3.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
gilrs = "0.11.2"
memmap2 = "0.9.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sys-locale = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
