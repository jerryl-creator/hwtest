[package]
name = "nyanspect"
version = "1.3.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
gilrs = "0.11.2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
