[package]
name = "nyanspect"
version = "1.3.0"
edition = "2024"
license = "MIT"

[dependencies]
# Same version egui uses: reads font metrics so mixed fonts share one baseline.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
gilrs = "0.11.2"
memmap2 = "0.9.12"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sys-locale = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system", "disk"] }
starship-battery = "0.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
windows-sys = { version = "0.61.2", features = ["Win32_System_SystemInformation"] }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
nokhwa-bindings-windows = { path = "vendor/nokhwa-bindings-windows" }

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
