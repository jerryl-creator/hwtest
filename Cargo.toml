[package]
name = "hwtest"
version = "1.2.0"
edition = "2024"
license = "MIT"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", features = ["glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

[profile.release]
opt-level = 3

[build-dependencies]
winresource = "0.1.34"
